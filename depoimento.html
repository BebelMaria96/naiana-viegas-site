<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Depoimento — Naiana Viegas</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f7f2e9; --ink:#37322b; --muted:#776d5e; --terra:#c47d39; --terra-deep:#a9622a; --blue:#4d627f; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; padding:24px;
      font-family:"Nunito Sans", system-ui, sans-serif; color:var(--ink);
      background: radial-gradient(circle at 50% 120%, rgba(196,125,57,.08), transparent 60%), var(--paper);
      display:flex; align-items:center; justify-content:center;
    }
    .card {
      background:#fff; border-radius:40px; padding:clamp(40px,6vw,60px) clamp(28px,5vw,48px);
      max-width:460px; width:100%; text-align:center;
      box-shadow:0 26px 56px -30px rgba(77,98,127,.55);
    }
    .ico {
      width:74px; height:74px; border-radius:50%; margin:0 auto 22px;
      display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:700;
      background:var(--terra); color:#fff;
    }
    h1 { font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:clamp(1.6rem,4vw,2.1rem); line-height:1.15; margin:0 0 12px; }
    p { color:var(--muted); font-size:1.08rem; line-height:1.6; margin:0 0 30px; }
    a.btn {
      display:inline-block; background:var(--terra); color:#fff; font-weight:700;
      text-decoration:none; padding:14px 30px; border-radius:999px; transition:background .3s;
    }
    a.btn:hover { background:var(--terra-deep); }
  </style>
</head>
<body>
  <div class="card">
    <div class="ico" id="ico">✓</div>
    <h1 id="titulo">Obrigada!</h1>
    <p id="msg"></p>
    <a class="btn" href="/">Voltar ao site</a>
  </div>

  <script>
    (function () {
      var r = new URLSearchParams(location.search).get("r");
      var mapa = {
        aprovado: { ico: "✓", cor: "#4a7a3a", t: "Depoimento aprovado!", m: "Pronto. Ele já vai aparecer na seção de experiências do site." },
        recusado: { ico: "×", cor: "#a9622a", t: "Depoimento recusado", m: "Tudo certo, ele não será publicado." },
        erro:     { ico: "!", cor: "#a9622a", t: "Algo deu errado", m: "Não foi possível concluir agora. Tente de novo pelo link do e-mail." },
        invalido: { ico: "?", cor: "#4d627f", t: "Link inválido", m: "Esse link de aprovação não é válido ou já foi usado." }
      };
      var d = mapa[r] || mapa.invalido;
      var ico = document.getElementById("ico");
      ico.textContent = d.ico;
      ico.style.background = d.cor;
      document.getElementById("titulo").textContent = d.t;
      document.getElementById("msg").textContent = d.m;
    })();
  </script>
</body>
</html>
